<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>호남고속선 재해예방공사 · 공정계획 입력</title>
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<meta name="color-scheme" content="only light">
<meta name="robots" content="noindex,nofollow">
<style>
:root{color-scheme:only light;--bg:#e9e9ea;--panel:#f6f6f7;--ink:#1d1f20;--sub:rgba(29,31,32,.6);--pri:#5980a6;--pri2:#416180;--hd:#181a1d;--hd2:#94bce3;--bd:rgba(29,31,32,.18);--bdl:rgba(29,31,32,.1);--ora:#e8590c;--grn:#2b8a3e;--red:#c92a2a;--yel:#f5c518}
*{box-sizing:border-box;margin:0}
body{font:14px/1.45 Barlow,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--ink);background:var(--bg);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hide{display:none!important}
.login{max-width:380px;margin:12vh auto;background:#fff;border:1px solid var(--bd);padding:28px}
.login h1{font-size:19px;margin-bottom:4px}.login p{color:var(--sub);font-size:13px;margin-bottom:16px}
.fld{display:block;margin-bottom:12px}.fld span{display:block;font-size:12px;font-weight:600;color:var(--sub);margin-bottom:3px}
.fld input,.fld select,.fld textarea{width:100%;padding:8px 10px;border:1px solid var(--bd);background:#fff;min-height:36px}
.btn{border:1px solid var(--pri);background:var(--pri);color:#fff;padding:7px 14px;font-weight:600;min-height:34px}
.btn:hover{background:var(--pri2)}.btn.ghost{background:#fff;color:var(--pri2)}.btn.ghost:hover{background:#eef3f8}
.btn.red{background:var(--red);border-color:var(--red)}.btn.sm{padding:3px 9px;min-height:26px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.err{color:var(--red);font-size:13px;margin:6px 0;min-height:18px}
.ok{color:var(--grn);font-size:13px}
#app{display:grid;grid-template-columns:190px 1fr;grid-template-rows:auto 1fr;min-height:100vh}
header{grid-column:1/3;background:var(--hd);color:#fff;display:flex;align-items:center;gap:18px;padding:10px 18px}
header h1{font-size:16px;font-weight:700;flex:1}header h1 small{display:block;color:var(--hd2);font-weight:400;font-size:12px}
header .who{font-size:13px;color:var(--hd2);text-align:right}header .who b{color:#fff}
header .dd b{font-size:24px;font-weight:700;color:#fff;line-height:1}header .dd span{display:block;font-size:11px;color:var(--hd2);text-align:right}
header button{background:transparent;border:1px solid var(--hd2);color:var(--hd2);padding:4px 10px;min-height:28px}
aside{background:#fff;border-right:1px solid var(--bd);padding:10px 0}
aside button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;border-left:4px solid transparent;background:transparent;padding:11px 16px;font-weight:600;color:var(--ink)}
aside button:hover{background:#f0f3f6}aside button.on{border-left-color:var(--pri);background:#e8eff6;color:var(--pri2)}
aside .cnt{background:var(--ora);color:#fff;font-size:11px;border-radius:9px;padding:0 6px;min-width:18px;text-align:center}
main{padding:16px 20px 60px;overflow:auto;min-width:0}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.top h2{font-size:18px;margin-right:8px}.top .sp{flex:1}
.top select,.top input[type=month],.top input[type=date]{padding:5px 8px;border:1px solid var(--bd);background:#fff;min-height:32px}
.card{background:var(--panel);border:1px solid var(--bd);padding:12px 14px;margin-bottom:14px;position:relative}
.card h3{font-size:14.5px;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}.card h3 small{font-weight:400;color:var(--sub);font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--bd);padding:10px 14px}.kpi .l{font-size:12px;color:var(--sub);font-weight:600}.kpi .v{font-size:28px;font-weight:700;line-height:1.2}.kpi .v small{font-size:13px;color:var(--sub);margin-left:2px}.kpi .d{font-size:12px;color:var(--sub)}
table.t{width:100%;border-collapse:collapse;background:#fff;font-size:13px}
table.t th{background:#dde6ee;font-weight:700;text-align:left;padding:6px 8px;border:1px solid var(--bd);position:sticky;top:0;z-index:2;white-space:nowrap}
table.t td{padding:4px 6px;border:1px solid var(--bdl);vertical-align:top}
table.t tr.lock td{background:#f3f6f3}table.t tr.dirty td{background:#fff8e1}
table.t input[type=text],table.t input[type=number],table.t select,table.t textarea{width:100%;border:1px solid transparent;background:transparent;padding:3px 4px;min-height:26px}
table.t input:hover,table.t select:hover,table.t textarea:hover{border-color:var(--bd)}table.t input:focus,table.t textarea:focus,table.t select:focus{border-color:var(--pri);background:#fff;outline:0}
table.t textarea{resize:vertical;min-height:40px}
table.t input:disabled,table.t textarea:disabled,table.t select:disabled{color:var(--ink);opacity:1;-webkit-text-fill-color:var(--ink)}
.num{text-align:right}
.badge{display:inline-block;font-size:11.5px;padding:1px 8px;border:1px solid var(--bd);background:#fff;white-space:nowrap}
.b-작성중{background:#e9ecef}.b-제출{background:#fff0e0;border-color:var(--ora);color:#a33f00}.b-확정{background:#e3f4e6;border-color:var(--grn);color:#1c6a2b}.b-반려{background:#fde8e8;border-color:var(--red);color:var(--red)}.b-미작성{color:var(--sub)}.b-취소{color:var(--sub);text-decoration:line-through}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--bd);background:#fff;padding:3px 12px;min-height:30px}.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.note{font-size:12.5px;color:var(--sub);margin:6px 0}
.tot{margin-top:10px;display:flex;gap:24px;font-size:13.5px;flex-wrap:wrap}.tot b{font-size:16px}
/* gantt */
.gwrap{overflow:auto;background:#fff;border:1px solid var(--bd);max-height:calc(100vh - 190px)}
.g{position:relative}
.g .row{display:flex;height:30px;border-bottom:1px solid var(--bdl);align-items:center}
.g .row.h{background:#dde6ee;position:sticky;top:0;z-index:5;height:28px;font-weight:700}
.g .row.crew{background:#eef2f6;font-weight:700;height:24px}
.g .lab{flex:0 0 230px;position:sticky;left:0;z-index:4;background:inherit;background-color:#fff;padding:0 8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border-right:1px solid var(--bd);cursor:pointer;font-size:12.5px;height:100%;display:flex;align-items:center}
.g .row.h .lab,.g .row.crew .lab{background:inherit;cursor:default}
.g .row.crew .lab{background:#eef2f6}.g .row.h .lab{background:#dde6ee}
.g .lab:hover{background:#eaf1f8}
.g .lane{position:relative;height:100%}
.g .bar{position:absolute;top:6px;height:15px;background:var(--pri);border-radius:2px;cursor:pointer}
.g .bar.pend{top:21px;height:6px;background:repeating-linear-gradient(45deg,var(--ora),var(--ora) 4px,#fff 4px,#fff 7px);border:1px solid var(--ora)}
.g .bar.orig{top:3px;height:3px;background:#7a7f85}
.g .stop{position:absolute;top:0;bottom:0;background:rgba(120,120,130,.16);pointer-events:none;z-index:1}
.g .today{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:3;pointer-events:none}
.g .mt{position:absolute;top:0;height:100%;border-left:1px solid var(--bd);padding-left:3px;font-size:11px;white-space:nowrap}
.g .mline{position:absolute;top:0;bottom:0;border-left:1px solid var(--bdl);pointer-events:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:430px;background:#fff;border-left:2px solid var(--pri);box-shadow:-6px 0 18px rgba(0,0,0,.18);z-index:30;padding:16px;overflow:auto}
.drawer h3{font-size:16px;margin-bottom:2px}.drawer .x{position:absolute;top:8px;right:10px;border:0;background:transparent;font-size:22px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:30px}
.modal .box{background:#fff;max-width:92vw;max-height:92vh;overflow:auto;padding:12px;position:relative}.modal img{max-width:88vw;max-height:80vh;display:block}
.drop{border:2px dashed var(--pri);background:#f0f5fa;padding:26px;text-align:center;color:var(--pri2);cursor:pointer}.drop.over{background:#dcebf8}
#busy{position:fixed;left:0;top:0;height:3px;width:0;background:var(--ora);z-index:99;transition:width .4s}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 18px;z-index:99;max-width:80vw;display:none}
#toast.e{background:var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:1000px){#app{grid-template-columns:1fr}aside{display:flex;overflow-x:auto}aside button{width:auto;white-space:nowrap}.grid2{grid-template-columns:1fr}.drawer{width:100%}}
</style></head><body>
<div id="busy"></div><div id="toast"></div>

<div id="setup" class="hide"><div class="login">
 <h1>서버 주소 설정</h1><p>처음 한 번만 입력합니다. 관리자가 알려준 웹 앱 주소(https://script.google.com/…/exec)를 붙여넣으세요.</p>
 <label class="fld"><span>웹 앱 주소</span><input id="apiIn" type="text" placeholder="https://script.google.com/macros/s/…/exec"></label>
 <div class="err" id="apiErr"></div><button class="btn" id="apiGo">저장</button>
</div></div>

<div id="login-wrap" class="hide"><div class="login">
 <h1>호남고속선 재해예방공사</h1><p>공정계획 입력·확인 (직원용)</p>
 <label class="fld"><span>이름</span><input id="lgName" type="text" autocomplete="username"></label>
 <label class="fld"><span>PIN</span><input id="lgPin" type="password" autocomplete="current-password"></label>
 <div class="err" id="lgErr"></div>
 <button class="btn" id="lgGo" style="width:100%">로그인</button>
</div></div>

<div id="pin-wrap" class="hide"><div class="login">
 <h1>새 PIN 설정</h1><p>처음 로그인했거나 PIN이 초기화되었습니다. 본인만 아는 PIN(영문·숫자 6자 이상)으로 바꿔주세요.</p>
 <label class="fld"><span>새 PIN</span><input id="pn1" type="password" autocomplete="new-password"></label>
 <label class="fld"><span>새 PIN 확인</span><input id="pn2" type="password" autocomplete="new-password"></label>
 <div class="err" id="pnErr"></div><button class="btn" id="pnGo" style="width:100%">변경하고 시작</button>
</div></div>

<div id="app" class="hide">
 <header><h1>호남고속선 정읍~광주송정 등 28개소 재해예방공사<small>공정계획 입력·승인 · 국가철도공단 호남본부 / (주)동우건설</small></h1>
  <div class="dd"><b id="dd">-</b><span>준공기한까지</span></div>
  <div class="who"><b id="whoN"></b><br><span id="whoR"></span></div>
  <button id="refBtn">새로고침</button><button id="pinBtn">PIN 변경</button><button id="outBtn">로그아웃</button></header>
 <aside id="side"></aside>
 <main id="main"></main>
</div>
<div id="drawer" class="drawer hide"></div>
<div id="modal" class="modal hide"></div>

<script src="config.js"></script>
<script>
(function(){
'use strict';
var CFG=window.PC_CONFIG||{};
function $(id){return document.getElementById(id)}
function esc(s){return String(s===null||s===undefined?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
/* ---------- 날짜 ---------- */
function d2n(s){var p=String(s).split('-');return Math.round(Date.UTC(+p[0],+p[1]-1,+p[2])/864e5)}
function n2d(n){var d=new Date(n*864e5);return d.getUTCFullYear()+'-'+('0'+(d.getUTCMonth()+1)).slice(-2)+'-'+('0'+d.getUTCDate()).slice(-2)}
function todayStr(){if(window.__TODAY)return window.__TODAY;var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function mondayOf(s){var n=d2n(s),w=(new Date(n*864e5)).getUTCDay();return n2d(n-((w+6)%7))}
function monthEnd(m){var p=m.split('-');return n2d(Math.round(Date.UTC(+p[0],+p[1],1)/864e5)-1)}
function addMonth(m,k){var p=m.split('-'),t=(+p[0])*12+(+p[1]-1)+k;return Math.floor(t/12)+'-'+('0'+(t%12+1)).slice(-2)}
function fmt(s){return s?s.slice(2).replace(/-/g,'.'):''}
var WD=['일','월','화','수','목','금','토'];
function fmtW(s){var n=d2n(s);return fmt(s)+' ~ '+n2d(n+6).slice(5).replace('-','.')}
/* ---------- API ---------- */
function apiUrl(){
 try{if(/^(localhost|127\.0\.0\.1)$/.test(location.hostname)){var q=new URLSearchParams(location.search).get('api');if(q)return q}}catch(e){}
 var u=CFG.API_URL||'';if(!u){try{u=localStorage.getItem('honamApi')||''}catch(e){}}return u;
}
var busyN=0;
function busy(d){busyN+=d;$('busy').style.width=busyN>0?'70%':'0'}
function toast(m,err){var t=$('toast');t.textContent=m;t.className=err?'e':'';t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){t.style.display='none'},err?5000:2600)}
function api(action,payload){
 var body=Object.assign({action:action,token:TOKEN},payload||{});busy(1);
 return fetch(apiUrl(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}).then(function(r){return r.json()}).then(function(r){busy(-1);
  if(r&&r.error==='AUTH'){logout('접속 시간이 지났습니다. 다시 로그인하세요.');throw new Error('AUTH')}return r},function(e){busy(-1);throw new Error('서버에 연결하지 못했습니다')});
}
function call(action,payload,okMsg){return api(action,payload).then(function(r){if(!r.ok){toast(r.error||'실패했습니다',true);throw new Error(r.error)}if(okMsg)toast(okMsg);return r})}
/* ---------- 상태 ---------- */
var TOKEN='',ME=null,DB=null,TAB='overview';
var UI={crew:'내',month:null,week:null,upSite:'',upCat:'',gSel:null};
var DRAFT={month:{},week:{}};
function dirtyCount(){return Object.keys(DRAFT.month).length+Object.keys(DRAFT.week).length}
window.addEventListener('beforeunload',function(e){if(dirtyCount()){e.preventDefault();e.returnValue=''}});
function isAppr(){return ME&&ME.role==='승인자'}function canEdit(){return ME&&ME.role!=='조회자'}
function siteBy(no){for(var i=0;i<DB.sites.length;i++)if(DB.sites[i]['번호']===no)return DB.sites[i]}
function eff(){var b={};DB.plans.forEach(function(p){if(p['상태']!=='확정')return;if(!b[p['개소']]||p['개정']>b[p['개소']]['개정'])b[p['개소']]=p});return b}
function pend(){var b={};DB.plans.forEach(function(p){if(p['상태']==='제출')b[p['개소']]=p});return b}
function planPct(site,day,E){var p=E[site['번호']];if(!p)return 0;var a=d2n(p['착수']),z=d2n(p['준공']),t=d2n(day);if(t<a)return 0;if(t>=z)return 100;return Math.round((t-a+1)/(z-a+1)*1000)/10}
function weighted(list,E,fn){var w=0,s=0;list.forEach(function(x){var c=x['직접공사비']||1;w+=c;s+=c*fn(x)});return w?Math.round(s/w*10)/10:0}
function mySites(){return DB.sites.filter(function(s){return UI.crew==='전체'||(UI.crew==='내'?(ME.crew==='전체'||s['조']===ME.crew):s['조']===UI.crew)})}
/* ---------- 로그인 ---------- */
function show(id){['setup','login-wrap','pin-wrap','app'].forEach(function(x){$(x).className=x===id?'':'hide'})}
function start(){
 if(!apiUrl()){show('setup');return}
 var t='';try{t=sessionStorage.getItem('honamTok')||''}catch(e){}
 if(t){TOKEN=t;load().then(function(){enter()},function(){show('login-wrap')});return}
 try{$('lgName').value=localStorage.getItem('honamName')||''}catch(e){}
 show('login-wrap');
}
function logout(msg){TOKEN='';try{sessionStorage.removeItem('honamTok')}catch(e){}DB=null;show('login-wrap');$('lgErr').textContent=msg||'';$('lgPin').value='';closeDrawer()}
$('apiGo').onclick=function(){var v=$('apiIn').value.trim();if(!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(v)){$('apiErr').textContent='주소 형식이 맞지 않습니다';return}try{localStorage.setItem('honamApi',v)}catch(e){}start()};
$('lgGo').onclick=doLogin;$('lgPin').onkeydown=function(e){if(e.key==='Enter')doLogin()};
function doLogin(){
 var name=$('lgName').value.trim(),pin=$('lgPin').value;$('lgErr').textContent='';if(!name||!pin){$('lgErr').textContent='이름과 PIN을 입력하세요';return}
 $('lgGo').disabled=true;
 api('login',{name:name,pin:pin}).then(function(r){$('lgGo').disabled=false;if(!r.ok){$('lgErr').textContent=r.error;return}
  TOKEN=r.token;ME=r.user;try{sessionStorage.setItem('honamTok',TOKEN);localStorage.setItem('honamName',name)}catch(e){}
  if(ME.mustChange){show('pin-wrap')}else load().then(enter)},function(e){$('lgGo').disabled=false;$('lgErr').textContent=e.message});
}
function doPin(){var a=$('pn1').value,b=$('pn2').value;$('pnErr').textContent='';if(a!==b){$('pnErr').textContent='두 PIN이 다릅니다';return}
 api('changePin',{pin:a}).then(function(r){if(!r.ok){$('pnErr').textContent=r.error;return}TOKEN=r.token;try{sessionStorage.setItem('honamTok',TOKEN)}catch(e){}ME.mustChange=false;$('pn1').value=$('pn2').value='';toast('PIN을 바꿨습니다');load().then(enter)})}
$('pnGo').onclick=doPin;
$('refBtn').onclick=function(){refresh().then(function(){toast('새로 불러왔습니다')}).catch(function(){})};
$('pinBtn').onclick=function(){show('pin-wrap');$('pn1').focus()};
$('outBtn').onclick=function(){if(dirtyCount()&&!confirm('저장하지 않은 입력이 있습니다. 로그아웃할까요?'))return;api('logout').catch(function(){});logout()};
function load(){return api('getAll').then(function(r){if(!r.ok)throw new Error(r.error);DB=r;ME=r.user;return r})}
function enter(){
 if(ME.mustChange){show('pin-wrap');return}
 show('app');var t=todayStr();UI.month=UI.month||t.slice(0,7);UI.week=UI.week||mondayOf(t);
 if(ME.crew==='전체')UI.crew='전체';
 $('whoN').textContent=ME.name;$('whoR').textContent=ME.role+(ME.crew&&ME.crew!=='전체'?' · '+ME.crew+'조':'');
 var dl=DB.settings['준공기한'];$('dd').textContent=dl?'D-'+(d2n(dl)-d2n(t)):'-';
 render();
}
function refresh(keepTab){return load().then(function(){render()})}
/* ---------- 레이아웃 ---------- */
var TABS=[['overview','개요'],['gantt','공구계획'],['month','월간계획'],['week','주간계획'],['upload','사진·서류'],['inbox','승인함','a'],['admin','관리','a']];
function render(){
 var pc=DB.plans.filter(function(x){return x['상태']==='제출'}).length+DB.months.filter(function(x){return x['상태']==='제출'}).length+DB.weeks.filter(function(x){return x['상태']==='제출'}).length;
 $('side').innerHTML=TABS.filter(function(t){return !t[2]||isAppr()}).map(function(t){return '<button data-tab="'+t[0]+'" class="'+(TAB===t[0]?'on':'')+'">'+t[1]+(t[0]==='inbox'&&pc?'<span class="cnt">'+pc+'</span>':'')+'</button>'}).join('');
 var f={overview:rOverview,gantt:rGantt,month:function(){rPeriod('month')},week:function(){rPeriod('week')},upload:rUpload,inbox:rInbox,admin:rAdmin}[TAB];
 var sc=$('main').scrollTop;f();$('main').scrollTop=sc;
}
$('side').onclick=function(e){var b=e.target.closest('button');if(!b)return;TAB=b.getAttribute('data-tab');closeDrawer();render();if(TAB!=='upload'&&TAB!=='gantt'){load().then(render).catch(function(){})}};
function st(x){return '<span class="badge b-'+esc(x)+'">'+esc(x)+'</span>'}
